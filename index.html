<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0e1420">
<title>Lodge Draft Board</title>
<style>
:root{
  --bg:#0e1420; --card:#161f2e; --card2:#1c2739; --line:#26334a;
  --text:#e8edf5; --dim:#8b98ad; --faint:#5c6a80;
  --accent:#4da3ff; --gold:#f5b942; --green:#3ddc84; --red:#ff5d5d;
  --qb:#ff6b6b; --rb:#3ddc84; --wr:#4da3ff; --te:#ffa94d; --k:#c084fc; --dst:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(#0e1420f2,#0e1420e6);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px 8px}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-size:1.02rem;font-weight:800;letter-spacing:.02em}
h1 span{color:var(--gold)}
.pickinfo{font-size:.8rem;color:var(--dim);text-align:right;line-height:1.3}
.pickinfo b{color:var(--text)}
.onclock{color:var(--gold);font-weight:700}
main{padding:10px 10px 20px;max-width:640px;margin:0 auto}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:#111927fa;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:none;color:var(--faint);font-size:.68rem;font-weight:600;padding:9px 0 7px;cursor:pointer}
.tabs button .ic{display:block;font-size:1.15rem;margin-bottom:2px}
.tabs button.on{color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--dim);border-radius:999px;padding:5px 13px;font-size:.8rem;font-weight:700;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#08111f}
.search{width:100%;margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:9px 12px;font-size:1rem}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-top:7px;cursor:pointer}
.row.gone{opacity:.32}
.row.mine{border-color:var(--gold);background:#20283a}
.rk{min-width:2.1em;text-align:center;font-weight:800;font-size:.95rem;color:var(--dim)}
.pbadge{min-width:3.4em;text-align:center;border-radius:8px;font-weight:800;font-size:.74rem;padding:4px 0;color:#08111f}
.pQB{background:var(--qb)}.pRB{background:var(--rb)}.pWR{background:var(--wr)}.pTE{background:var(--te)}.pK{background:var(--k)}.pDST{background:var(--dst)}
.pinfo{flex:1;min-width:0}
.pname{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psub{font-size:.74rem;color:var(--dim);margin-top:1px}
.pnums{text-align:right;line-height:1.35}
.vorp{font-weight:800;font-size:.92rem}
.adp{font-size:.72rem;color:var(--dim)}
.tag{display:inline-block;font-size:.66rem;font-weight:800;border-radius:6px;padding:2px 6px;margin-left:5px;vertical-align:1px}
.tag.val{background:#123b26;color:var(--green)}
.tag.risk{background:#3b1d12;color:#ffa94d}
.tag.rook{background:#1d2a44;color:#7fb6ff}
.sheet{position:fixed;inset:0;z-index:40;background:#000a;display:none;align-items:flex-end}
.sheet.open{display:flex}
.sheetin{background:var(--card2);width:100%;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheetin h3{font-size:1rem;margin-bottom:2px}
.sheetin .sub{color:var(--dim);font-size:.8rem;margin-bottom:12px}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:13px;font-size:.98rem;font-weight:800;margin-top:8px;cursor:pointer}
.btn.mine{background:var(--gold);color:#1a1204}
.btn.other{background:#2a3a55;color:var(--text)}
.btn.undo{background:#3b1d1d;color:var(--red)}
.btn.ghost{background:none;color:var(--dim)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
.seg button{flex:1;background:none;border:none;color:var(--dim);font-weight:700;font-size:.8rem;padding:8px;cursor:pointer}
.seg button.on{background:var(--accent);color:#08111f}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:10px}
.card h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-bottom:8px}
.bignum{font-size:1.5rem;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.statbox{background:var(--card2);border-radius:10px;padding:9px 11px}
.statbox .l{font-size:.68rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.statbox .v{font-size:1.05rem;font-weight:800;margin-top:2px}
.warn{color:#ffa94d}.ok{color:var(--green)}.bad{color:var(--red)}
textarea{width:100%;min-height:150px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:10px;font-size:.85rem;margin-top:8px}
.slotrow{display:flex;align-items:center;gap:9px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.9rem}
.slotrow:last-child{border-bottom:none}
.slotlabel{min-width:3.2em;font-weight:800;color:var(--faint);font-size:.78rem}
.empty{color:var(--faint);font-style:italic}
.note{font-size:.8rem;color:var(--dim);line-height:1.5;margin-top:6px}
.note b{color:var(--text)}
.rankinput{width:3.6em;background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:6px 4px;font-size:.9rem;text-align:center}
select,input[type=number]{background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px;font-size:.95rem}
.flash{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1204;font-weight:800;padding:8px 18px;border-radius:999px;z-index:60;font-size:.85rem;box-shadow:0 4px 18px #0008;opacity:0;transition:opacity .2s}
.flash.show{opacity:1}
h4.sect{margin:14px 4px 2px;font-size:.78rem;color:var(--faint);text-transform:uppercase;letter-spacing:.07em}
.duel{display:flex;gap:10px;margin-top:12px}
.duelcard{flex:1;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:20px 10px;text-align:center;cursor:pointer;transition:border-color .1s}
.duelcard:active{border-color:var(--gold);background:var(--card2)}
.duelcard .dn{font-weight:800;font-size:1.05rem;line-height:1.2}
.duelcard .ds{font-size:.75rem;color:var(--dim);margin-top:6px;line-height:1.5}
.vs{align-self:center;font-weight:900;color:var(--faint);font-size:.9rem}
.pbar{height:6px;background:var(--card2);border-radius:99px;margin-top:10px;overflow:hidden}
.pbar div{height:100%;background:var(--accent);border-radius:99px}
.posgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.posbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left}
.posbtn .t{font-weight:800}
.posbtn .s{font-size:.72rem;color:var(--dim);margin-top:2px}
.posbtn.done{border-color:var(--green)}
.arrows button{background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--text);width:2em;height:2em;font-size:.9rem;cursor:pointer;margin-left:4px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>🏈 LODGE <span>DRAFT</span></h1>
    <div class="pickinfo" id="pickinfo"></div>
  </div>
</header>
<main id="main"></main>
<nav class="tabs" id="tabs"></nav>
<div class="sheet" id="sheet"></div>
<div class="flash" id="flash"></div>
<script src="data.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
